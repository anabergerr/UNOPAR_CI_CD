name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Estagio 1: roda os testes unitarios em Python.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_app.py

  # Estagio 2: constroi a imagem Docker (so na main).
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t unopar_ci_cd:latest .

  # Estagio 3: deploy simulado (placeholder). Em producao, aqui entraria
  # o push para o Docker Hub e/ou o deploy no servidor alvo.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy simulado para producao - branch ${{ github.ref_name }}"
